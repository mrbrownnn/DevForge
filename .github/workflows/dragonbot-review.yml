name: DragonBot Review

# DragonBot's second job: a first-pass review on every pull request.
#
# It is CI, not product. The reviewer is `.github/dragonbot/review.py`, a
# standard-library script that lives beside this workflow and ships in nothing.
# The only thing it borrows from the project is `devforge security scan --json`,
# run as a step below and folded into the comment, restricted to the files the
# pull request touches.
#
# What it is not is an approval, and it never fails the run. Findings are posted;
# the `security (self-scan)` job in ci.yml is what gates a merge. A review bot that
# can block one is a review bot people turn off.
#
# Cost: none. The narrative section uses GitHub Models through the workflow's own
# `GITHUB_TOKEN` - that is what `models: read` below is for - so there is no API key
# and no per-pull-request bill. If the account has no Models access the request
# fails, the comment says that section was skipped, and every finding still posts.
#
# Identity: the comment comes from the DragonBot App when `DRAGONBOT_APP_ID` and
# `DRAGONBOT_PRIVATE_KEY` are configured (docs/contributing.md#dragonbot), and from
# `github-actions[bot]` when they are not. Neither is needed for the review to run.

on:
  pull_request:
    # `synchronize` is what makes this a review rather than a greeting: every push
    # to the branch re-runs it, and the comment is edited in place.
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  # Per pull request, and superseded runs are cancelled - the review of a commit
  # nobody is looking at any more is not worth a runner minute.
  group: dragonbot-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  # For GitHub Models, reached with GITHUB_TOKEN. If a runner ever rejects this
  # key, delete these two lines: the narrative section then reports itself as
  # skipped and the rest of the review is unaffected.
  models: read

jobs:
  review:
    name: review the diff
    # A draft is a work in progress, and reviewing one is the machine equivalent of
    # reading over someone's shoulder. `ready_for_review` above brings it back.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The pull request's own head, not the merge commit GitHub synthesises:
          # the review quotes `path:line`, and those have to be the line numbers a
          # reader sees in the diff.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: fetch the base commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags origin "$BASE_SHA"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: the reviewer's own tests
        # A bot that reviews other people's changes should be the first thing to
        # fail when its own change is wrong. These are not in `testpaths`, so the
        # project's test job does not run them and this one has to.
        run: |
          pip install pytest
          pytest .github/dragonbot -q

      - name: security scan of the checkout
        # `scan` exits 1 on a blocking finding, which is right for the gate in
        # ci.yml and wrong here: this job reports, it does not enforce. The findings
        # are read from the JSON either way.
        run: |
          pip install -e .
          devforge security scan . --json > scan.json || true

      - name: write the pull request description to a file
        # Through the environment, never interpolated into the script. A title or
        # body on a fork's pull request is attacker-controlled text, and `${{ }}`
        # inside `run:` is substituted before the shell ever sees it.
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$BODY" > pr-body.md

      - name: review the diff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python .github/dragonbot/review.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --scan scan.json \
            --title "$TITLE" \
            --body-file pr-body.md \
            --llm \
            --out review.md
          cat review.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/create-github-app-token@v2
        id: token
        # Fork pull requests have no access to secrets, so the App token cannot be
        # minted there and the step is skipped rather than failed.
        if: >-
          vars.DRAGONBOT_APP_ID != '' &&
          github.event.pull_request.head.repo.full_name == github.repository
        with:
          app-id: ${{ vars.DRAGONBOT_APP_ID }}
          private-key: ${{ secrets.DRAGONBOT_PRIVATE_KEY }}

      - name: post or update the review comment
        # One comment per pull request, edited on every push. Nine pushes should
        # leave one review behind, not nine.
        id: post
        # A fork's job token is read-only, so posting is the one step allowed to
        # fail without failing the run: the review exists either way.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.token.outputs.token || secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # The marker is the first line of every review this bot writes, which is
          # how it finds its own comment without keeping state anywhere.
          existing="$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- dragonbot-review -->")) | .id] | first // empty')"
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@review.md >/dev/null
            echo "updated comment $existing"
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@review.md >/dev/null
            echo "posted a new comment"
          fi

      - name: say where the review went when it could not be posted
        # The usual reason is a pull request from a fork, whose job token is
        # read-only. The review still ran; only its delivery changed.
        if: steps.post.outcome == 'failure'
        run: |
          echo "The review could not be posted as a comment - on a pull request from a" \
            "fork the job token is read-only. The review is in this run's summary above." \
            >> "$GITHUB_STEP_SUMMARY"
