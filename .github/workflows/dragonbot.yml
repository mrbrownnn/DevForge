name: DragonBot

# DragonBot replaces Dependabot, for one reason: it opens its pull requests as a
# GitHub App this repository owns, so they carry this project's own bot identity
# instead of a shared one. Everything below is ordinary CI - the App only supplies
# the token the pull request is opened with.
#
# Setup, once (see docs/contributing.md#dragonbot):
#   1. Create a GitHub App owned by this account, name it DragonBot, give it a
#      dragon avatar.
#   2. Repository permissions: Contents (read & write), Pull requests (read &
#      write). No account permissions, no webhook.
#   3. Install it on this repository.
#   4. Repository variable DRAGONBOT_APP_ID = the App's ID.
#      Repository secret  DRAGONBOT_PRIVATE_KEY = the App's .pem, whole file.
#
# Until those two exist the job skips rather than failing, so an unconfigured
# repository stays green.

on:
  schedule:
    # 06:00 UTC on the first of the month. Dependency drift is a monthly concern;
    # a daily bot is a bot people filter out of their inbox.
    - cron: "0 6 1 * *"
  workflow_dispatch:

concurrency:
  group: dragonbot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  updates:
    name: check for updates
    if: vars.DRAGONBOT_APP_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/create-github-app-token@v2
        id: token
        with:
          app-id: ${{ vars.DRAGONBOT_APP_ID }}
          private-key: ${{ secrets.DRAGONBOT_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.token.outputs.token }}

      - name: bump actions to their latest major
        id: actions
        # Only `@vN` refs are touched. A branch ref such as
        # `pypa/gh-action-pypi-publish@release/v1` is how that action asks to be
        # pinned, and rewriting it to a tag would be a downgrade in intent.
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          summary=""
          # Anchored to the start of the line so only real `uses:` keys match. An
          # unanchored pattern also matches the `uses:` inside the rewrite below,
          # and the bot then reads its own source as if it were a dependency.
          pattern='^[[:space:]]*(- )?uses: [^ ]+@v[0-9]+'
          refs="$(grep -rhoE "$pattern" .github/workflows/*.yml | sed -E 's/^[[:space:]]*(- )?uses: //' | sort -u)"
          for ref in $refs; do
            repo="${ref%@*}"
            current="${ref#*@}"
            latest="$(gh api "repos/$repo/releases/latest" --jq .tag_name 2>/dev/null)" || continue
            case "$latest" in
              v[0-9]*) ;;
              *) continue ;;
            esac
            major="${latest%%.*}"
            [ "$major" = "$current" ] && continue
            sed -i "s|uses: $repo@$current|uses: $repo@$major|g" .github/workflows/*.yml
            summary="${summary}- \`$repo\` \`$current\` → \`$major\` (latest release \`$latest\`)"$'\n'
          done
          if [ -n "$summary" ]; then
            { echo "list<<EOF"; printf '%s' "$summary"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          fi

      - name: report which dependency floors have moved
        id: floors
        # Reported, never rewritten. The version specifiers in pyproject.toml are
        # floors, not pins: raising one narrows what a user is allowed to install,
        # and that is a decision with a reason behind it, not a chore a bot should
        # do on its own. What the bot can usefully say is how far behind each floor
        # now is.
        run: |
          python - <<'PY' > floors.md
          import json, re, tomllib, urllib.request

          project = tomllib.load(open("pyproject.toml", "rb"))["project"]
          requirements = [(raw, "runtime") for raw in project["dependencies"]]
          for extra, entries in (project.get("optional-dependencies") or {}).items():
              requirements += [(raw, extra) for raw in entries]

          rows = []
          for raw, group in requirements:
              match = re.match(r"^([A-Za-z0-9_.-]+)\s*>=\s*([0-9][0-9A-Za-z.*-]*)$", raw.strip())
              if not match:
                  continue
              name, floor = match.groups()
              try:
                  with urllib.request.urlopen(
                      f"https://pypi.org/pypi/{name}/json", timeout=20
                  ) as response:
                      latest = json.load(response)["info"]["version"]
              except Exception as exc:
                  rows.append(f"| `{name}` | {group} | `{floor}` | could not check: {exc} |")
                  continue
              if latest != floor:
                  rows.append(f"| `{name}` | {group} | `{floor}` | `{latest}` |")

          if rows:
              print("| package | group | floor | latest on PyPI |")
              print("| --- | --- | --- | --- |")
              print("\n".join(rows))
          PY
          if [ -s floors.md ]; then
            { echo "table<<EOF"; cat floors.md; echo "EOF"; } >> "$GITHUB_OUTPUT"
          fi
          rm -f floors.md

      - name: open or update the pull request
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ACTION_LIST: ${{ steps.actions.outputs.list }}
          FLOOR_TABLE: ${{ steps.floors.outputs.table }}
        run: |
          if [ -z "$ACTION_LIST" ] && [ -z "$FLOOR_TABLE" ]; then
            echo "nothing to report"
            exit 0
          fi

          {
            echo "Opened by DragonBot on its monthly run."
            echo
            if [ -n "$ACTION_LIST" ]; then
              echo "## Action versions, updated in this branch"
              echo
              echo "$ACTION_LIST"
              echo
              echo "Only \`@vN\` refs are moved, and only to the latest major. CI on this"
              echo "pull request is what says whether the bump is safe."
              echo
            fi
            if [ -n "$FLOOR_TABLE" ]; then
              echo "## Dependency floors that have moved, reported only"
              echo
              echo "$FLOOR_TABLE"
              echo
              echo "Nothing here is changed automatically. These specifiers are floors,"
              echo "not pins - raising one narrows what a user may install, which is a"
              echo "decision with a reason behind it rather than a chore."
            fi
          } > body.md

          # No changed files means there is only a report to deliver, and a pull
          # request needs a commit. The report goes to the run summary instead.
          if git diff --quiet; then
            cat body.md >> "$GITHUB_STEP_SUMMARY"
            echo "no file changes; reported in the run summary"
            exit 0
          fi

          # The App's own identity, so the commit is attributed the same way the
          # pull request is. GitHub links a bot commit by the numeric user id in the
          # address, not by the name, so the id is looked up rather than guessed.
          slug="${{ steps.token.outputs.app-slug }}"
          bot_id="$(gh api "/users/${slug}[bot]" --jq .id)"
          git config user.name "${slug}[bot]"
          git config user.email "${bot_id}+${slug}[bot]@users.noreply.github.com"

          branch="dragonbot/updates"
          git checkout -B "$branch"
          git add -A
          git commit -q -m "ci: update action versions" -m "Opened by DragonBot."
          git push -q --force-with-lease origin "$branch"

          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            gh pr edit "$branch" --body-file body.md
            echo "updated the existing pull request"
          else
            # The label is a convenience, not the point: a repository that does not
            # have it must still get the pull request.
            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$branch" \
              --title "ci: monthly action and dependency check" \
              --body-file body.md \
              --label dependencies \
            || gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$branch" \
              --title "ci: monthly action and dependency check" \
              --body-file body.md
          fi
