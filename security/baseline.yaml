    location: tests/security/test_security_center.py
    reason: The parametrised table that asserts SEC-CODE-002 fires. It is the fixture.
    expires: 2027-08-31
    accepted_by: mrbrownnn

  - id: SEC-CODE-003
    location: tests/security/test_security_center.py
    reason: The parametrised table that asserts SEC-CODE-003 fires. It is the fixture.
    expires: 2027-08-31
