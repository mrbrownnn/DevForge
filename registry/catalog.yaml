# DevForge skill catalogue
#
# Individual installable skills, as opposed to registry/skills.yaml which records a
# trust decision about a whole *repository*. Nobody wants 41 plugins because they
# wanted one, so installation works from this file.
#
# What an entry is: a claim about WHERE a skill lives - repository, commit, path.
# What an entry is NOT: a claim about what the skill CONTAINS. `content_hash` and
# `last_audited` stay null until `devforge skill audit` has actually fetched and
# inspected the tree, at which point they are filled in from evidence.
#
# Pins were verified against the GitHub API on 2026-08-19. Paths were verified by
# reading each repository's tree, not inferred from a naming convention.
#
# risk_level here is the *catalogued expectation* (mostly `read`, since most of these
# are instruction files). The authoritative number is the one an audit produces from
# the fetched tree; a mismatch is itself a finding.

version: 1
generated_at: "2026-08-19"
description: >
  Skills from the sources surveyed in docs/skill-ecosystem.md. Inclusion means the
  source was evaluated and the path verified - not that the skill is trusted. Every
  entry starts unaudited, and installation refuses anything above the risk ceiling
  without an explicit human approval.

