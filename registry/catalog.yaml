    license: Apache-2.0
    license_file: skills/webapp-testing/LICENSE.txt
    capabilities: [browser-testing, screenshot-capture, ui-debugging]
    dependencies: [python3, playwright]
    supported_runtimes: ["*"]
    required_tools: [browser, shell, filesystem]
    required_permissions: [process_execution, network]
    risk_level: execute
    security_status: unaudited
    tags: [browser, playwright, testing]
    compatibility:
      agents: [claude-code]
      notes: Ships helper scripts under scripts/; those are quarantined on install.
    notes: >
      Its SKILL.md instructs the agent not to read script source before running it.
      DevForge never executes skill content, so that instruction has no effect here -
      but it is why this entry is expected to audit above LOW.

