# DevForge skill source registry
#
# Machine-readable catalogue of THIRD-PARTY skill sources. Every entry is data about
# an external repository - nothing here is installed, trusted, or executed by virtue
# of being listed. Disposition and trust tier are decisions; everything else is
# evidence.
#
# Provenance of the evidence: GitHub REST API (repos, contents, git/trees), queried
# 2026-08-19. Fields that were NOT verified are recorded as null or "unknown" rather
# than guessed. Star and issue counts are a point-in-time snapshot and are expected
# to drift; the commit pin is the field that matters.
#
# Schema is validated by devforge.supplychain.registry - see tests/test_registry_file.py.

version: 1
generated_at: "2026-08-19"

evidence:
  method: github-rest-api
  verified_at: "2026-08-19"
  verified_fields: [license, maintainer, activity, head_commit, skill_names, file_inventory]
  unverified_fields: [known_vulnerabilities, transitive_dependencies, runtime_behaviour]
  notes: >
    No CVE database, advisory feed, or dynamic analysis was consulted. "no_known_issues"
    below means "nothing found in the repository issue tracker metadata we read", NOT
    "audited and clean". Treat every source as untrusted until a DevForge review
    records otherwise.

# Trust tiers govern what a source may do once installed. They are DevForge policy,
# not a property of the upstream project.
trust_tiers:
  untrusted:
    description: Default for every new source. Instructions only.
    allow_scripts: false
    allow_network: false
    allow_install_commands: false
    requires_approval: true
  reviewed:
    description: A human read the skill content and recorded the review in the registry.
    allow_scripts: false
    allow_network: false
    allow_install_commands: false
    requires_approval: true
  audited:
    description: Content reviewed AND executable surface audited at a pinned commit.
    allow_scripts: true
    allow_network: false
    allow_install_commands: false
    requires_approval: true
  first_party:
    description: Skills shipped inside DevForge itself.
    allow_scripts: true
    allow_network: false
    allow_install_commands: false
    requires_approval: false

# How DevForge may consume a source.
#   reference        - documented, fetched on demand, never copied into this repo
#   vendor           - copied in at a pinned commit, with license notice
#   dynamic_install  - fetched at runtime (NOT implemented; recorded for completeness)
#   rejected         - do not use, with a reason
dispositions: [reference, vendor, dynamic_install, rejected]

defaults:
  trust_tier: untrusted
  disposition: reference
  requires_approval: true
  allow_scripts: false

