      files_total: 508
      by_extension: { ".py": 70, ".sh": 2, ".js": 1 }
      opaque_archives: 0
    dependencies:
      declared: unknown
      observed: [python3, playwright, node]
      notes: Skill scripts import third-party Python packages; no lockfile in the repo.
    security_concerns:
      - id: instruction-to-execute-unread-code
        severity: high
        evidence: >
          skills/webapp-testing/SKILL.md instructs the agent "Always run scripts with
          --help first" and "DO NOT read the source until you try running the script
          first". This is an explicit instruction to execute code before inspecting it,
          which directly contradicts the DevForge inspection model.
      - id: large-script-surface
        severity: medium
        evidence: 70 Python scripts under skills/*/scripts, executed with agent privileges.
      - id: license-ambiguity
        severity: medium
        evidence: No root LICENSE; redistribution terms must be resolved per skill.
    known_issues: no_known_issues_recorded
    disposition: reference
    trust_tier: untrusted
    review:
      status: not_reviewed
      reviewer: null
      reviewed_at: null
    rationale: >
      Highest-quality reference for skill format and for the Playwright (webapp-testing)
      and MCP (mcp-builder) categories. Referenced rather than vendored because of the
      root-license ambiguity and the script surface. Any use of its scripts requires an
      audit and a move to the audited tier.

