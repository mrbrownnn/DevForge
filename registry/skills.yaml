# Categories the brief asked about where no credible source was found. Recorded as gaps
# rather than filled with something weak.
gaps:
  - category: kubernetes-cloud-operations
    finding: >
      No reputable dedicated Kubernetes or cloud-operations skill repository surfaced.
      The nearest coverage is ci-cd-and-automation in addyosmani-agent-skills.
    action: Re-survey next quarter; do not adopt a low-signal repository to fill the slot.
  - category: agent-evaluation-harnesses
    finding: >
      No established skill-level evaluation or benchmarking source found. Testing content
      exists (superpowers TDD, trailofbits mutation and property-based testing) but
      evaluation of the agent itself is unserved.
    action: DevForge verification layer covers this need internally for now.
