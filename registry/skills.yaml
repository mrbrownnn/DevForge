    trust_tier: untrusted
    review:
      status: not_reviewed
      reviewer: null
      reviewed_at: null
    rationale: >
      Rejected for Phase 0. The combination of opaque archives, a credential-handling
      skill, a deployment skill with real side effects, an off-GitHub installer and no
      license is precisely the profile the supply-chain model exists to refuse. Nothing
      about the quality of the content - the risk profile is simply wrong for a default.

