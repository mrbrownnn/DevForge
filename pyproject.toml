[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devforge"
version = "0.1.0"
description = "DevForge - an extensible AI software-engineering harness"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "PyYAML>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]
# Enables devforge.tools.browser. Without it the tool reports unavailable rather
# than fabricating page content. Also needs: playwright install chromium
browser = ["playwright>=1.40"]
# Enables the pixel-diff corroboration in devforge.visual.compare. Without it the
# report says "pixel comparison: not performed" and gives the reason; the
# structural comparison, which is the primary signal, still runs.
visual = ["Pillow>=10.0", "numpy>=1.26"]

[project.scripts]
devforge = "devforge.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"devforge.builtin" = [
    "workflows/*.yaml",
    "agents/*.yaml",
    "policies/*.yaml",
    "templates/*.md",
    "skills/*/SKILL.md",
    "benchmarks/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# UP042: `str, Enum` is kept over `StrEnum` so enum values serialise identically
# on every supported interpreter and stay comparable to plain strings.
ignore = ["UP042"]
