[build-system]
# 77+ for PEP 639: an SPDX `license` string plus `license-files`.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "devforge"
version = "1.2.0-beta.2"
description = "DevForge - an extensible AI software-engineering harness"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
# The license text itself ships in the wheel; "MIT" as a string is a claim, the
# file is the grant. Without it nobody can vendor DevForge at a company.
license-files = ["LICENSE"]
authors = [{ name = "Pham Van Thanh" }]
keywords = ["ai", "agents", "llm", "coding-agent", "orchestration", "verification"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pydantic>=2.13.4",
    "typer>=0.12",
    "PyYAML>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=7.1.0", "ruff>=0.5"]
# Enables devforge.tools.browser. Without it the tool reports unavailable rather
# than fabricating page content. Also needs: playwright install chromium
browser = ["playwright>=1.40"]
# Enables the property-based falsification strategy. Without it that strategy
# reports unavailable with the reason, and the run records the gap - it never
# degrades to a weaker search and calls the result a survival.
falsification = ["hypothesis>=6.0"]
# Enables the pixel-diff corroboration in devforge.visual.compare. Without it the
# report says "pixel comparison: not performed" and gives the reason; the
# structural comparison, which is the primary signal, still runs.
visual = ["Pillow>=10.0", "numpy>=1.26"]

[project.scripts]
devforge = "devforge.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"devforge.builtin" = [
    "workflows/*.yaml",
    "agents/*.yaml",
    "assistants/*.yaml",
    "runtimes/*.yaml",
    "policies/*.yaml",
    "templates/*.md",
    "skills/*/SKILL.md",
    "benchmarks/*.yaml",
    "benchmarks/eval/*.yaml",
    "evals/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    # Evaluation cases spawn pytest in a temporary workspace, so these run in
    # seconds rather than milliseconds. Deselect with: -m "not slow"
    "slow: runs a real subprocess and takes seconds",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# UP042: `str, Enum` is kept over `StrEnum` so enum values serialise identically
# on every supported interpreter and stay comparable to plain strings.
ignore = ["UP042"]
